---
- name: copy httpd.conf and restart httpd
  hosts: datadog.shadowman.dev
  tasks:
    - name: copy apache configuration file
      ansible.builtin.copy:
        src: files/httpd.conf
        dest: /etc/httpd/conf/httpd.conf
    - name: restart httpd
      ansible.builtin.service:
        name: httpd
        state: restarted
