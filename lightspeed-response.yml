---
- name: copy httpd.conf file
  hosts: dataylor-demo123.shadowman.dev
  tasks:
    - name: copy httpd.conf to the proper location
      ansible.builtin.copy:
        src: files/httpd.conf
        dest: /etc/httpd/conf/httpd.conf
    - name: restart httpd
      ansible.builtin.service:
        name: httpd
        state: restarted
