---
- name: Retrieve last 20 nginx-related audit log entries
  ansible.builtin.shell:
    cmd: set -o pipefail && grep nginx /var/log/audit/audit.log | tail -20
    executable: /bin/bash
  register: service_logs
  changed_when: false
  failed_when: false

- name: Set stats for next controller job
  ansible.builtin.set_stats:
    data:
      service_log_output: "\"{{ service_logs.stdout }}\""
      max_tokens: 2000
