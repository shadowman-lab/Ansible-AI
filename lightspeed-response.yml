---
- name: move a file to a different location and restart a service
  hosts: dataylor-demo123.shadowman.dev
  tasks:
    - name: copy a file
      ansible.builtin.copy:
        src: files/httpd.conf
        dest: /etc/httpd/conf/httpd.conf
    - name: restart httpd
      ansible.builtin.service:
        name: httpd
        state: restarted
