---
- name: This is a play within a playbook
  hosts: datadog.shadowman.dev
  tasks:
    - name: Copy a file.
      ansible.builtin.copy:
        src: files/httpd.conf
        dest: /etc/httpd/conf/httpd.conf
    - name: Restart a service.
      ansible.builtin.service:
        name: httpd
        state: restarted
